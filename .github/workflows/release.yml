name: build-fpk

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show version
        run: grep -n 'FALLBACK_VERSION' app/server.py

      - name: Sanity checks
        run: |
          echo "--- 未定义全局名（NameError 隐患）"
          python tools/namelint.py app/server.py build_fpk.py
          echo "--- 事件检测分支全覆盖"
          python tools/detect_test.py
          echo "--- fpk 真实布局冒烟"
          python tools/layout_test.py
          echo "--- 通知推送端到端（假 SMTP / 假 Webhook）"
          python tools/notify_test.py
          echo "--- 电池健康判定（正常电池不许判成建议更换）"
          python tools/assess_test.py
          echo "--- 市电统计口径（OB 的 0V 不算欠压 / 测试不算停电）"
          python tools/power_test.py
          echo "--- 采集器行为（失联只记一条 / 无效帧剔除）"
          python tools/collector_test.py

      - name: Build fpk (x86_64 + arm64)
        run: python build_fpk.py --both

      - name: List artifacts
        run: ls -l dist/

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: upshealth-fpk
          path: |
            dist/*.fpk
            dist/*.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.fpk
            dist/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
