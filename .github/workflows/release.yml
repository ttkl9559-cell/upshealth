name: build-fpk

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show version
        run: grep -n 'FALLBACK_VERSION' app/server.py

      - name: Build fpk (x86_64 + arm64)
        run: python build_fpk.py --both

      - name: List artifacts
        run: ls -l dist/

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: upshealth-fpk
          path: |
            dist/*.fpk
            dist/*.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.fpk
            dist/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
